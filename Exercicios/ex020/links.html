<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        h1{
            background-color: aqua;
            padding: 100px;
            margin: 100px;
        }

        a{
            text-decoration: none;
            color: darkred;
            font-weight: bold;
        }

        a:hover{
            color: rgb(217, 28, 28);
            text-decoration: underline;
        }

        a:active{
            color: rgb(231, 151, 151);
        }

        .especial{
            background-color: red;
        }

        .especial::after{
            content: "@";
        }

        .especial::before{
            content: "@";
        }
    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="#" class="especial">Github.com.br</a></li>
        <li><a href="#">marcinho.com.br</a></li>
        <li><a href="#">youtube.com.br</a></li>
    </ul>
</body>
</html>
